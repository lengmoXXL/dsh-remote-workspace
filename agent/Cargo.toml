[package]
name = "dsh-remote-agent"
version = "0.0.5"
edition = "2021"
rust-version = "1.75"
description = "The remote daemon of dsh-remote-workspace: serves one machine's filesystem, processes, git worktrees, and terminals to a DeepSeek Harness plugin over a token-authenticated connection."
license = "MIT"
repository = "https://github.com/lengmoXXL/dsh-remote-workspace"
homepage = "https://github.com/lengmoXXL/dsh-remote-workspace#readme"

[[bin]]
name = "dsh-remote-agent"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "process",
  "sync",
  "time",
  "signal",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
