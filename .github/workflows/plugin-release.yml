name: Plugin release

on:
  push:
    tags: ['plugin-v*']
  # Dispatch on the tag ref itself; a branch run fails the guard.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The tag names the asset the install line downloads, so a tag that disagrees
  # with package.json must never publish one.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json version
        run: |
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "package.json has no version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "plugin-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin-v$version from package.json" >&2
            exit 1
          fi

  # The tarball is what a deployment installs: `npm ci` runs the `prepare`
  # script, which is what puts the built `lib/` into it.
  pack:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The crate is the whole of `agent/`; there is no root manifest.
          workspaces: agent
      - run: npm ci
      - run: npm run typecheck
      # The e2e suite drives the real agent, so the release is cut only from a
      # tree whose full suite passes against it.
      - run: cargo build --release --manifest-path agent/Cargo.toml
      - name: Test
        run: |
          export DSH_REMOTE_AGENT_BIN="$PWD/agent/target/release/dsh-remote-agent"
          npm test
      - name: Pack the plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a tag can produce more than one run, and the loser of
          # that race must upload to the release the winner created instead of
          # failing the workflow.
          gh release create "$GITHUB_REF_NAME" \
            dist/dsh-remote-workspace-*.tgz \
            --repo lengmoXXL/dsh-remote-workspace \
            --verify-tag --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" \
            dist/dsh-remote-workspace-*.tgz \
            --repo lengmoXXL/dsh-remote-workspace --clobber
