name: Plugin publish

on:
  push:
    tags: ['plugin-v*']
  # Dispatch on the tag ref itself; a branch run fails the guard.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag names the version being published, so a tag that disagrees with
  # package.json must never publish one.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json version
        run: |
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "package.json has no version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "plugin-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin-v$version from package.json" >&2
            exit 1
          fi

  publish:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # registry-url is what lets NODE_AUTH_TOKEN below reach the registry.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The crate is the whole of `agent/`; there is no root manifest.
          workspaces: agent
      # npm ci runs the prepare script, which is what puts the built lib/ into
      # the tarball npm publishes.
      - run: npm ci
      - run: npm run typecheck
      # The e2e suite drives the real agent, so a version is published only from
      # a tree whose full suite passes against it.
      - run: cargo build --release --manifest-path agent/Cargo.toml
      - name: Test
        run: |
          export DSH_REMOTE_AGENT_BIN="$PWD/agent/target/release/dsh-remote-agent"
          npm test
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
