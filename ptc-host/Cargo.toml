[package]
name = "dsh-ptc-host"
version = "0.0.6"
edition = "2021"
description = "The V8 program host of dsh-remote-workspace: runs one model-written PTC program in a remote execution world, without Node."
license = "MIT"
repository = "https://github.com/lengmoXXL/dsh-remote-workspace"
homepage = "https://github.com/lengmoXXL/dsh-remote-workspace#readme"

[[bin]]
name = "dsh-ptc-host"
path = "src/main.rs"

[dependencies]
# The V8 engine the harness's Node PTC backend otherwise supplies. The prebuilt
# static archive is fetched by the crate's own build script for the target.
v8 = "152.2.0"

[dev-dependencies]
# The protocol test frames JSON in Rust rather than through Node.
serde_json = "1"
# The protocol test hands the child its control socketpair on descriptor 7.
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
