name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range the manifests declare, one LTS at each end.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # There is no root manifest: each crate is its own workspace.
          workspaces: |
            agent
            ptc-host
      - run: npm ci
      - run: npm run typecheck
      # The e2e suite drives both real binaries, so build them before testing.
      # The test run builds the plugin itself through its `pretest` script.
      - run: cargo build --release --manifest-path agent/Cargo.toml
      # The PTC program host carries an embedded V8, so this leg pays for the
      # engine's prebuilt archive once; the other Node leg reads the cache.
      - run: cargo build --release --manifest-path ptc-host/Cargo.toml
      - name: Test
        run: |
          export DSH_REMOTE_AGENT_BIN="$PWD/agent/target/release/dsh-remote-agent"
          export DSH_PTC_HOST_BIN="$PWD/ptc-host/target/release/dsh-ptc-host"
          npm test
      - name: Built artifacts exist
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts
          test -f lib/client.js

  rust:
    strategy:
      fail-fast: false
      matrix:
        # The Rust half behaves differently on the two platforms this plugin
        # reaches: PTY allocation, foreground groups, and the `/proc` evidence
        # behind `term.inspectForeground` are per-OS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent
            ptc-host
      - run: cargo fmt --manifest-path agent/Cargo.toml -- --check
      - run: cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/Cargo.toml
      # The PTC program host is its own crate with its own protocol tests; a
      # stand-in host drives the built binary over a real descriptor-7
      # socketpair, so these cases need no Node.
      - run: cargo fmt --manifest-path ptc-host/Cargo.toml -- --check
      - run: cargo clippy --manifest-path ptc-host/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path ptc-host/Cargo.toml
      # The Linux release assets are musl static builds, and musl types the
      # `ioctl` request differently from glibc, so type-check that target here
      # rather than discovering it when a release is already tagged. The PTC
      # program host needs its own musl V8 archive, which is a different
      # download from the host's.
      - if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo check --manifest-path agent/Cargo.toml --target x86_64-unknown-linux-musl --all-targets
          cargo check --manifest-path ptc-host/Cargo.toml --target x86_64-unknown-linux-musl
